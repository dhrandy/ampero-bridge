services:
  ampero-bridge:
    # Build context straight from git, like mc-bot. Dockhand pulls and builds.
    build: https://github.com/dhrandy/ampero-bridge.git#main
    # Secrets live in Dockhand's Environment tab. ${API_KEY} is interpolated
    # from there at deploy time. Never put raw secret values in this file.
    environment:
      - PORT=8080
      - API_KEY=${API_KEY}
      # Override if the pedal's MIDI port name differs.
      - AMPERO_PORT=Ampero Mini MIDI
    ports:
      # Synology reverse proxy needs the port on the host interface, not localhost-only.
      - "28551:8080"
    devices:
      # USB MIDI (ALSA sequencer) so the bridge can see the pedal when it is
      # plugged in. The pedal only needs to be connected when changes are wanted.
      - /dev/snd:/dev/snd
    group_add:
      - audio
    volumes:
      # CasaOS-style host path for app data. The bridge is currently stateless
      # (backups save client-side), but this is here for logs/caches later.
      # Add the same path in Dockhand if you mount it.
      - /DATA/AppData/ampero-bridge:/data
    restart: unless-stopped
    # Don't wait long on stop: the bridge exits immediately on SIGTERM.
    stop_grace_period: 10s
